<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 12 — به‌کارگیری کنترل بتن آماده</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../lib/engine.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 12</div><div class="tag">به‌کارگیری کنترل بتن آماده</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۱۲ — به‌کارگیری کنترل بتن آماده</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">برگه تحویل، آزمون و ردیابی محموله</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="book-controls controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">برگه تحویل را با محموله، محل، نمونه و آزمون پیوند بدهم</button><button data-ok="0">فقط شماره کامیون را نگه دارم</button><button data-ok="0">آب یا افزودنی اضافه‌شده را ثبت نکنم</button><p id="result"></p></div></div><section class="panel simulation-panel" aria-labelledby="flow-title"><h2 id="flow-title">شبیه‌ساز سفارش → تولید → تحویل</h2><p>سناریوی آموزشی برای دیدن زنجیره ردیابی است. تکمیل فیلدها به‌تنهایی گواهی انطباق بتن نیست.</p><div class="sim-grid">
<label>شناسه سفارش<input id="o-id" value="O-100"></label><label>پروژه<input id="o-project" value="P-01"></label><label>مشخصات بتن<input id="o-spec" value="C30"></label><label>رده مقاومت<input id="o-strength" value="C30"></label><label>حجم (m³)<input id="o-volume" type="number" value="24"></label><label>روش انتقال<input id="o-method" value="کامیون مخلوط‌کن"></label>
<label>شناسه کامیون<input id="d-truck" value="T-01"></label><label>شناسه برگه تحویل<input id="d-ticket" value="D-01"></label><label>زمان بارگیری/اختلاط<input id="d-load" value="08:00"></label><label>زمان ورود<input id="d-arrival" value="08:35"></label><label>شروع تخلیه<input id="d-discharge" value="08:40"></label>
</div><button id="run-flow">بازسازی زنجیره</button><div id="flow-output" class="sim-result" aria-live="polite"></div><p class="sim-source"><strong>SOURCE:</strong> فصل ۶ بندهای 6-1 تا 6-5 و فصل ۱۲ بندهای 12-1 و 12-2.</p></section></main><script src="./app.js"></script><script src="../lib/simulations.js"></script><script>(function(){const b=document.getElementById('run-flow'),o=document.getElementById('flow-output');if(!b||!o)return;b.onclick=()=>{const r=SimulationEngine.orderDelivery.calculate({orderId:document.getElementById('o-id').value,project:document.getElementById('o-project').value,concreteSpec:document.getElementById('o-spec').value,strengthClass:document.getElementById('o-strength').value,volumeM3:Number(document.getElementById('o-volume').value),deliveryMethod:document.getElementById('o-method').value,truckId:document.getElementById('d-truck').value,ticketId:document.getElementById('d-ticket').value,loadTime:document.getElementById('d-load').value,arrivalTime:document.getElementById('d-arrival').value,dischargeStart:document.getElementById('d-discharge').value});if(!r.valid){o.textContent=r.error;o.className='sim-result bad';return}o.innerHTML='<strong>'+(r.traceable?'زنجیره سفارش تا تحویل قابل ردیابی است.':'زنجیره ناقص است و نیاز به تکمیل سوابق دارد.')+'</strong><br>سفارش: '+(r.orderComplete?'کامل':'ناقص')+'<br>برگه/تحویل: '+(r.deliveryComplete?'کامل':'ناقص')+(r.missingOrder.length?'<br>ناقص در سفارش: '+r.missingOrder.join('، '):'')+(r.missingDelivery.length?'<br>ناقص در تحویل: '+r.missingDelivery.join('، '):'');o.className='sim-result '+(r.traceable?'good':'bad')}})();</script><script src="../lib/engine.js"></script></body></html>
