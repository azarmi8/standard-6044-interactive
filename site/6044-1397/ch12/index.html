<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 12 — به‌کارگیری کنترل بتن آماده</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 12</div><div class="tag">به‌کارگیری کنترل بتن آماده</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۱۲ — به‌کارگیری کنترل بتن آماده</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">برگه تحویل، آزمون و ردیابی محموله</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="controls"><nav class="chapter-nav" aria-label="ناوبری فصل"><a class="secondary nav-link" href="../ch11/">← فصل قبلی</a><a class="secondary nav-link" href="../">فهرست</a><a class="secondary nav-link" href="../ch13/">فصل بعدی →</a></nav><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">برگه تحویل را با محموله، محل، نمونه و آزمون پیوند بدهم</button><button data-ok="0">فقط شماره کامیون را نگه دارم</button><button data-ok="0">آب یا افزودنی اضافه‌شده را ثبت نکنم</button><p id="result"></p></div></div><section class="panel simulation-panel" aria-labelledby="flow-title"><h2 id="flow-title">شبیه‌ساز سفارش → تولید → تحویل</h2><p>سناریوی آموزشی برای دیدن زنجیره ردیابی است. تکمیل فیلدها به‌تنهایی گواهی انطباق بتن نیست.</p><div class="sim-grid">
<label>شناسه سفارش<input id="o-id" value="O-100"></label><label>پروژه<input id="o-project" value="P-01"></label><label>مشخصات بتن<input id="o-spec" value="C30"></label><label>رده مقاومت<input id="o-strength" value="C30"></label><label>حجم (m³)<input id="o-volume" type="number" value="24"></label><label>روش انتقال<input id="o-method" value="کامیون مخلوط‌کن"></label>
<label>شناسه کامیون<input id="d-truck" value="T-01"></label><label>شناسه برگه تحویل<input id="d-ticket" value="D-01"></label><label>زمان بارگیری/اختلاط<input id="d-load" value="08:00"></label><label>زمان ورود<input id="d-arrival" value="08:35"></label><label>شروع تخلیه<input id="d-discharge" value="08:40"></label>
</div><button id="run-flow">بازسازی زنجیره</button><div id="flow-output" class="sim-result" aria-live="polite"></div><p class="sim-source"><strong>SOURCE:</strong> فصل ۶ بندهای 6-1 تا 6-5 و فصل ۱۲ بندهای 12-1 و 12-2.</p></section></main><script>
const beats=[
["برگه تحویل","برگه تحویل و شناسه محموله یکی از نقاط اصلی ردیابی است؛ اطلاعات آن باید بتواند بار را به مشخصات سفارش و سوابق بعدی وصل کند."],
["مشخصات محموله","مشخصات، مقدار، رده و زمان‌های مرتبط با تحویل باید به شکل روشن ثبت شوند تا کنترل کیفیت بداند نتیجه مربوط به کدام بتن است."],
["محل پروژه و نمونه","ارتباط محموله با محل پروژه و نمونه‌های گرفته‌شده باید حفظ شود. این ارتباط برای تفسیر نتایج و بررسی عدم انطباق اهمیت دارد."],
["آزمون و پذیرش","آزمون و تصمیم پذیرش باید بر اساس مشخصات مربوط و نتایج ثبت‌شده انجام شود؛ یک نتیجه بدون شناسه یا بدون معیار قابل تفسیر کامل نیست."],
["آب و افزودنی در محل","آب یا افزودنی افزوده‌شده در محل، در صورت انجام، باید در سوابق مرتبط با محموله ثبت شود تا تغییرات ترکیب بتن قابل ردیابی باشد."],
["تصمیم QC","در کنترل واقعی، برگه تحویل فقط یک فرم اداری نیست: کلید اتصال سفارش، بار، محل، تغییرات، نمونه‌ها، آزمون و تصمیم پذیرش است."]
];let i=0,t=null,$=id=>document.getElementById(id);function render(){let b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('q').textContent=b[0];$('sub').textContent='سفارش → برگه تحویل → محل → نمونه → آزمون → پذیرش';$('count').textContent=(i+1)+' / '+beats.length;$('bar').style.width=((i+1)/beats.length*100)+'%';$('cards').innerHTML=beats.map((v,k)=>'<g><rect x="'+(140+k*230)+'" y="220" width="200" height="275" rx="22" fill="'+(k===i?'#173c2a':'#dce9df')+'"/><text x="'+(240+k*230)+'" y="285" font-size="19" font-weight="700" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+(k+1)+'</text><text x="'+(240+k*230)+'" y="345" font-size="18" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+v[0].slice(0,14)+'</text></g>').join('')}function stop(){if(t){clearInterval(t);t=null;$('play').textContent='پخش'}}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(t){stop();return}t=setInterval(()=>{if(i===beats.length-1){stop();return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('result').textContent=b.dataset.ok==='1'?'درست — کنترل بتن آماده بدون ردیابی محموله ناقص است.':'کافی نیست — باید بتوان تغییرات و نتایج را به محموله مشخص نسبت داد.'});render();
</script><script src="../lib/simulations.js"></script><script>(function(){const b=document.getElementById('run-flow'),o=document.getElementById('flow-output');if(!b||!o)return;b.onclick=()=>{const r=SimulationEngine.orderDelivery.calculate({orderId:document.getElementById('o-id').value,project:document.getElementById('o-project').value,concreteSpec:document.getElementById('o-spec').value,strengthClass:document.getElementById('o-strength').value,volumeM3:Number(document.getElementById('o-volume').value),deliveryMethod:document.getElementById('o-method').value,truckId:document.getElementById('d-truck').value,ticketId:document.getElementById('d-ticket').value,loadTime:document.getElementById('d-load').value,arrivalTime:document.getElementById('d-arrival').value,dischargeStart:document.getElementById('d-discharge').value});if(!r.valid){o.textContent=r.error;o.className='sim-result bad';return}o.innerHTML='<strong>'+(r.traceable?'زنجیره سفارش تا تحویل قابل ردیابی است.':'زنجیره ناقص است و نیاز به تکمیل سوابق دارد.')+'</strong><br>سفارش: '+(r.orderComplete?'کامل':'ناقص')+'<br>برگه/تحویل: '+(r.deliveryComplete?'کامل':'ناقص')+(r.missingOrder.length?'<br>ناقص در سفارش: '+r.missingOrder.join('، '):'')+(r.missingDelivery.length?'<br>ناقص در تحویل: '+r.missingDelivery.join('، '):'');o.className='sim-result '+(r.traceable?'good':'bad')}})();</script></body></html>
