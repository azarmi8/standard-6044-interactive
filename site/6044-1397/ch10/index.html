<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 10 — الزامات بتن تازه</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../lib/engine.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 10</div><div class="tag">الزامات بتن تازه</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۱۰ — الزامات بتن تازه</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">خواص تازه باید با روش آزمون و مشخصات سفارش خوانده شوند</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="book-controls controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><button id="fullscreen" class="secondary">تمام‌صفحه</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">خاصیت، روش آزمون و مشخصات مورد انتظار را با هم ببینم</button><button data-ok="0">فقط یک عدد ثبت کنم بدون اینکه بدانم چه خاصیتی را کنترل می‌کند</button><button data-ok="0">نتیجه را بدون ارتباط با زمان و محل تحویل تفسیر کنم</button><p id="result"></p></div></div><section class="panel simulation-panel" aria-labelledby="fresh-sim-title">
<h2 id="fresh-sim-title">شبیه‌ساز خواص بتن تازه</h2>
<p>این بخش آموزشی است؛ اعداد واردشده سناریو هستند. حدود رده‌ها از فصل ۱۰ گرفته شده‌اند.</p>
<div class="sim-grid">
<label>اسلامپ (mm)<input id="slump-input" type="number" step="1" value="125"></label>
<label>اسلامپ‌فلو (mm)<input id="flow-input" type="number" step="1" value="600"></label>
<label>چگالی اندازه‌گیری‌شده (kg/m³)<input id="density-measured" type="number" step="1" value="2400"></label>

</div>
<button id="run-fresh-sim">ارزیابی سناریو</button>
<div id="fresh-sim-output" class="sim-result" aria-live="polite"></div>
