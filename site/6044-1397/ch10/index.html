<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 10 — الزامات بتن تازه</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 10</div><div class="tag">الزامات بتن تازه</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۱۰ — الزامات بتن تازه</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">خواص تازه باید با روش آزمون و مشخصات سفارش خوانده شوند</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">خاصیت، روش آزمون و مشخصات مورد انتظار را با هم ببینم</button><button data-ok="0">فقط یک عدد ثبت کنم بدون اینکه بدانم چه خاصیتی را کنترل می‌کند</button><button data-ok="0">نتیجه را بدون ارتباط با زمان و محل تحویل تفسیر کنم</button><p id="result"></p></div></div></section></main><script>
const beats=[
["اسلامپ و S1 تا S4","رده‌های اسلامپ در فصل ۱۰: S1 میانگین 25 mm با دامنه 10–40؛ S2 میانگین 70 با دامنه 50–90؛ S3 میانگین 125 با دامنه 100–150؛ S4 میانگین 185 با دامنه 160–210 mm. نتیجه باید در چارچوب رده و مشخصات سفارش تفسیر شود."],
["بتن خودتراکم","برای SCC، رده‌های جریان اسلامپ SF0 تا SF3 مطرح‌اند: SF0 میانگین 500 با دامنه 450–550؛ SF1 میانگین 600 با دامنه 560–650؛ SF2 میانگین 700 با دامنه 660–750؛ SF3 میانگین 800 با دامنه 760–850 mm. پارامترهای J-ring، L-box، V-funnel و پایداری نیز در موارد مربوط بررسی می‌شوند."],
["هوای بتن","مقدار هوای بتن و حدود/تلرانس آن باید در ارتباط با مشخصات موردنیاز کنترل شود؛ روش آزمون و شرایط نمونه نیز بخشی از زنجیره اندازه‌گیری است."],
["دمای بتن","دمای بتن تازه طبق ASTM C1064/C1064M در محتوای این فصل مطرح شده است. زمان و شرایط آزمون باید در سوابق قابل ردیابی باشد."],
["چگالی","چگالی بتن تازه طبق ISIRI 3203-6 اندازه‌گیری می‌شود. چگالی اندازه‌گیری‌شده در محل تحویل نباید بیش از 25 kg/m³ با مقدار مشخص‌شده/درج‌شده در برگه تحویل اختلاف داشته باشد."],
["تصمیم QC","یک نتیجه تازه باید با سه پرسش خوانده شود: چه خاصیتی؟ با چه روش آزمونی؟ نسبت به چه مشخصات/رده‌ای؟ سپس نتیجه در سابقه محموله ثبت شود."]
];let i=0,t=null,$=id=>document.getElementById(id);function render(){let b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('q').textContent=b[0];$('sub').textContent='خاصیت → روش آزمون → معیار → ثبت';$('count').textContent=(i+1)+' / '+beats.length;$('bar').style.width=((i+1)/beats.length*100)+'%';$('cards').innerHTML=beats.map((v,k)=>'<g><rect x="'+(140+k*230)+'" y="220" width="200" height="275" rx="22" fill="'+(k===i?'#173c2a':'#dce9df')+'"/><text x="'+(240+k*230)+'" y="285" font-size="19" font-weight="700" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+(k+1)+'</text><text x="'+(240+k*230)+'" y="345" font-size="18" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+v[0].slice(0,14)+'</text></g>').join('')}function stop(){if(t){clearInterval(t);t=null;$('play').textContent='پخش'}}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(t){stop();return}t=setInterval(()=>{if(i===beats.length-1){stop();return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('result').textContent=b.dataset.ok==='1'?'درست — خاصیت، روش آزمون و معیار باید با هم دیده شوند.':'کافی نیست — عدد بدون زمینه، برای تصمیم انطباق کافی نیست.'});render();
</script></body></html>
