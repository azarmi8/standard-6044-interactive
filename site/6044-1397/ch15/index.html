<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 15 — ارزیابی انطباق</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 15</div><div class="tag">ارزیابی انطباق</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۱۵ — ارزیابی انطباق</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">نتیجه انطباق از مجموعه شواهد به دست می‌آید</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="controls"><nav class="chapter-nav" aria-label="ناوبری فصل"><a class="secondary nav-link" href="../ch14/">← فصل قبلی</a><a class="secondary nav-link" href="../">فهرست</a><a class="secondary nav-link" href="../ch16/">فصل بعدی →</a></nav><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">آزمون اولیه + کنترل تولید + ارزیابی لازم را کنار هم ببینم</button><button data-ok="0">فقط یک نتیجه ۲۸ روزه را مساوی با کل انطباق بدانم</button><button data-ok="0">بدون توجه به الزامات قانونی، گواهی را قطعی فرض کنم</button><p id="result"></p></div></div><section class="panel simulation-panel"><h2>شبیه‌ساز ارزیابی انطباق</h2><p>این شبیه‌ساز فقط آمادگی زنجیره ارزیابی را بررسی می‌کند؛ خروجی آن گواهی انطباق نیست.</p><div class="sim-grid"><label><input id="c-prod" type="checkbox" checked> کنترل تولید موجود است</label><label><input id="c-test" type="checkbox" checked> شواهد آزمون موجود است</label><label><input id="c-doc" type="checkbox" checked> مستندات و سوابق موجود است</label><label><input id="c-body"> ارزیابی نهاد ذی‌صلاح لازم است</label><label><input id="c-eval"> ارزیابی نهاد ذی‌صلاح انجام شده است</label></div><button id="run-conformity">ارزیابی زنجیره</button><div id="conformity-output" class="sim-result" aria-live="polite"></div><p class="sim-source"><strong>SOURCE:</strong> فصل ۱۵، بندهای 15-1 و 15-2؛ پیوست F برای ارزیابی، نظارت و گواهی کنترل تولید.</p></section></section></main><script>
const beats=[
["هدف ارزیابی انطباق","هدف، بررسی انطباق بتن آماده با الزامات موردنظر استاندارد و مشخصات مرتبط از مسیر شواهد و کنترل‌های تعیین‌شده است."],
["آزمون اولیه","آزمون اولیه در موارد لازم بخشی از شواهد است تا مشخص شود ترکیب و فرآیند قادر به دستیابی به مشخصات موردنظر هستند."],
["کنترل تولید","کنترل تولید طبق فصل ۱۴ یکی از پایه‌های ارزیابی انطباق است؛ بنابراین فصل ۱۵ بدون سیستم کنترل تولید قابل فهم نیست."],
["ارزیابی نهاد ذی‌صلاح","در مواردی که ارزیابی یا تأیید نهاد ذی‌صلاح لازم باشد، مدارک و نتایج سیستم باید برای ارزیابی در دسترس باشند."],
["گواهی و قانون","گواهی و الزامات قانونی باید در چارچوب آنچه استاندارد و مقررات مربوط تعیین می‌کنند دیده شوند؛ این صفحه جایگزین متن رسمی یا مقررات اجرایی نیست."],
["جمع‌بندی","انطباق یک خروجی زنجیره‌ای است: سفارش و مشخصات → مصالح → تولید → بتن تازه → نمونه و آزمون → کنترل تولید → ارزیابی و سوابق."]
];let i=0,t=null,$=id=>document.getElementById(id);function render(){let b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('q').textContent=b[0];$('sub').textContent='مشخصات → شواهد → ارزیابی → تصمیم';$('count').textContent=(i+1)+' / '+beats.length;$('bar').style.width=((i+1)/beats.length*100)+'%';$('cards').innerHTML=beats.map((v,k)=>'<g><rect x="'+(140+k*230)+'" y="220" width="200" height="275" rx="22" fill="'+(k===i?'#173c2a':'#dce9df')+'"/><text x="'+(240+k*230)+'" y="285" font-size="19" font-weight="700" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+(k+1)+'</text><text x="'+(240+k*230)+'" y="345" font-size="18" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+v[0].slice(0,14)+'</text></g>').join('')}function stop(){if(t){clearInterval(t);t=null;$('play').textContent='پخش'}}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(t){stop();return}t=setInterval(()=>{if(i===beats.length-1){stop();return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('result').textContent=b.dataset.ok==='1'?'درست — انطباق باید با مجموعه شواهد و الزامات مربوط ارزیابی شود.':'کافی نیست — یک نتیجه منفرد به‌تنهایی کل سیستم انطباق را توصیف نمی‌کند.'});render();
</script><script src="../lib/simulations.js"></script><script>(function(){const b=document.getElementById('run-conformity'),o=document.getElementById('conformity-output');b.onclick=function(){const r=SimulationEngine.ch15.calculate({productionControl:document.getElementById('c-prod').checked,testEvidence:document.getElementById('c-test').checked,documentation:document.getElementById('c-doc').checked,competentBodyRequired:document.getElementById('c-body').checked,competentBodyEvaluated:document.getElementById('c-eval').checked});if(!r.valid){o.textContent=r.error;o.className='sim-result bad';return}o.innerHTML='<strong>'+(r.assessmentReady?'زنجیره برای ارزیابی آماده است.':'زنجیره هنوز برای ارزیابی آماده نیست.')+'</strong><br>شواهد پایه: '+(r.baseReady?'کامل':'ناقص')+'<br>ارزیابی نهاد ذی‌صلاح: '+(r.externalEvaluationReady?'کافی/لازم نیست':'موردنیاز و انجام‌نشده')+(r.missing.length?'<br>موارد ناقص: '+r.missing.join('، '):'');o.className='sim-result '+(r.assessmentReady?'good':'bad')}}})();</script></body></html>
