<h2 id="e-sim-title">شبیه‌ساز کنترل تکمیلی بتن پرمقاومت</h2>
<p>سناریوی آموزشی: قبل از تولید، شواهد و کنترل‌های تکمیلی مرتبط را بررسی کن.</p>
<div class="sim-grid">
<label><input id="e-supplier" type="checkbox"> شواهد تأمین‌کننده مواد</label>
<label><input id="e-admixture" type="checkbox"> کنترل افزودنی‌ها</label>
<label><input id="e-powder" type="checkbox"> کنترل مواد مکمل پودری</label>
<label><input id="e-production" type="checkbox"> کنترل تکمیلی تولید</label>
</div>
<button id="run-e-sim">بررسی آمادگی</button>
<div id="e-output" class="sim-result" aria-live="polite"></div>
<p class="sim-source"><strong>SOURCE:</strong> پیوست هـ، جداول هـ-۱ و هـ-۲.</p>
</section>
<script src="../lib/appendix-d-g.js"></script>
<script>
(function(){const b=document.getElementById('run-e-sim'),o=document.getElementById('e-output');if(!b||!o)return;b.addEventListener('click',function(){const r=AppendixDG.highStrength.check({supplier:document.getElementById('e-supplier').checked,admixture:document.getElementById('e-admixture').checked,powder:document.getElementById('e-powder').checked,production:document.getElementById('e-production').checked});o.innerHTML='<strong>'+(r.complete?'کنترل‌های تکمیلی سناریو کامل است.':'سناریو هنوز ناقص است.')+'</strong>'+(r.missing.length?'<br>موارد ناقص: '+r.missing.join('، '):'<br>همه موارد کنترل تکمیلی ثبت شده‌اند.');o.className='sim-result '+(r.complete?'good':'bad');});})();
</script></section></main><script src="./app.js"></script><script src="../lib/engine.js"></script></body></html>
