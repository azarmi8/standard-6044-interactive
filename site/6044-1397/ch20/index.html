<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 20 — پیوست هـ — مقررات تکمیلی</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 20</div><div class="tag">پیوست هـ — مقررات تکمیلی</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="90" font-size="38" font-weight="700" text-anchor="end">فصل 20 — پیوست هـ — مقررات تکمیلی</text><rect x="130" y="220" width="1340" height="300" rx="34" fill="#dce9df" stroke="#173c2a" stroke-width="4"/><text id="a" x="800" y="330" font-size="34" font-weight="700" text-anchor="middle"></text><text id="c" x="800" y="410" font-size="25" text-anchor="middle"></text><rect x="130" y="580" width="1340" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="665" fill="#fff" font-size="25" text-anchor="middle"></text></svg></div><div class="controls"><button id="p" class="secondary">قبلی</button><button id="play">پخش</button><button id="n">بعدی</button><div class="progress"><i id="bar"></i></div><span id="num"></span></div><div class="panel"><h2 id="h"></h2><p id="b"></p><div class="quiz"><h3>بررسی سریع</h3><button id="yes">در زنجیره کنترل کیفیت و سوابق مرتبط بررسی می‌کنم</button><button id="no">فقط به یک نتیجه منفرد اکتفا می‌کنم</button><p id="r"></p></div></div></section></main><script>const x=["بررسی بتن پس از مسئله مقاومت/پذیرش","ترکیب شواهد آزمون و سوابق","تصمیم فنی مستند","قابلیت ردیابی"];let i=0,t=null,$=z=>document.getElementById(z);function R(){$('h').textContent=x[i];$('b').textContent='این موضوع باید با بندهای مرتبط، مشخصات پروژه، آزمون و سوابق قابل ردیابی دیده شود.';$('a').textContent=x[i];$('c').textContent='استاندارد ۶۰۴۴:۱۳۹۷ / مرحله '+(i+1)+' از '+x.length;$('q').textContent='این نکته را به فرآیند واقعی QC متصل کن.';$('num').textContent=(i+1)+' / '+x.length;$('bar').style.width=((i+1)/x.length*100)+'%'}$('n').onclick=()=>{i=Math.min(x.length-1,i+1);R()};$('p').onclick=()=>{i=Math.max(0,i-1);R()};$('play').onclick=()=>{if(t){clearInterval(t);t=null;$('play').textContent='پخش';return}t=setInterval(()=>{if(i===x.length-1){clearInterval(t);t=null;$('play').textContent='پخش'}else{i++;R()}},4500);$('play').textContent='توقف'};$('yes').onclick=()=>{$('r').textContent='درست — رویکرد استاندارد، زنجیره‌ای و قابل ردیابی است.'};$('no').onclick=()=>{$('r').textContent='کافی نیست — باید شواهد و سوابق مرتبط هم بررسی شوند.'};R();</script></body></html>
