<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 6 — اطلاعات سفارش</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 6</div><div class="tag">اطلاعات سفارش</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900" width="100%" height="100%"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="90" font-size="38" font-weight="700" text-anchor="end">فصل 6 — اطلاعات سفارش</text><text x="1450" y="135" font-size="22" fill="#68736b" text-anchor="end">سفارش / استاندارد ملی ایران ۶۰۴۴:۱۳۹۷</text><g id="cards"></g><rect x="130" y="570" width="1340" height="180" rx="30" fill="#173c2a"/><text id="svgt" x="800" y="635" fill="#fff" font-size="30" text-anchor="middle"></text><text id="svgsub" x="800" y="690" fill="#dce9df" font-size="21" text-anchor="middle"></text></svg></div><div class="controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><p>بهترین روش استفاده از این فصل در کنترل کیفیت چیست؟</p><button data-q="good">ارتباط آن با سفارش، تولید، آزمون و سوابق را بررسی کنم</button><button data-q="bad">فقط یک عدد آزمایشگاهی را نگاه کنم</button><button data-q="bad">بدون ثبت و ردیابی تصمیم بگیرم</button><p id="quizResult"></p></div></div></section></main><script>const beats=[["دو روش سفارش","سفارش می‌تواند بر مبنای مشخصات عملکردی بتن یا بر مبنای مشخصات ترکیب/طرح اختلاط انجام شود؛ روش انتخاب‌شده باید در سفارش و قرارداد روشن باشد."],["اطلاعات عملکردی","اطلاعاتی مانند اندازه اسمی بزرگ‌ترین سنگدانه، روانی/کارایی، هوای بتن، رده مقاومت، شرایط محیطی، محل تحویل، نوع سیمان، حداقل سیمان، مواد مکمل، نسبت آب مؤثر به مواد سیمانی و روش انتقال باید حسب مورد مشخص شوند."],["رده‌های مقاومت","فصل، رده‌های مقاومت C و LC را برای بتن معمولی و سبک معرفی می‌کند و کاربرد رده‌ها باید بر مبنای مشخصات فنی پروژه باشد."],["اسناد و ردیابی","طرح اختلاط، نسبت اجزا، مشخصات مواد، نتایج آزمون‌ها و اطلاعات لازم باید به‌صورت قابل ردیابی نگهداری شوند."],["مسئولیت‌ها","در سفارش عملکردی، تولیدکننده باید امکان دستیابی به مشخصات را فراهم کند؛ در سفارش ترکیبی، مشخصات اجزای طرح و الزامات مربوط باید صریح باشند."]];let i=0,timer=null;const $=id=>document.getElementById(id);function render(){const b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('svgt').textContent=b[0];$('svgsub').textContent='این مرحله را به مرحله بعدی زنجیره کنترل کیفیت وصل کن.';$('count').textContent=`${i+1} / ${beats.length}`;$('bar').style.width=`${(i+1)/beats.length*100}%`;}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='پخش';return}timer=setInterval(()=>{if(i===beats.length-1){clearInterval(timer);timer=null;$('play').textContent='پخش';return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('quizResult').textContent=b.dataset.q==='good'?'درست — استاندارد باید در یک زنجیره قابل ردیابی استفاده شود.':'این پاسخ دامنه کنترل را بیش از حد محدود می‌کند.';$('quizResult').className=b.dataset.q});render();</script></body></html>
