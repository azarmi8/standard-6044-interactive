<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 6 — اطلاعات سفارش</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 6</div><div class="tag">اطلاعات سفارش</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۶ — اطلاعات سفارش</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">سفارش باید قابل فهم، قابل تولید و قابل ردیابی باشد</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">نوع سفارش، خواص موردنیاز و اطلاعات تحویل را روشن کنم</button><button data-ok="0">فقط C را بنویسم و بقیه را بعداً حدس بزنم</button><button data-ok="0">بدون تعیین روش سفارش، تولید را شروع کنم</button><p id="result"></p></div></div></section></main><script>
const beats=[
["دو روش سفارش","سفارش می‌تواند بر مبنای مشخصات عملکردی بتن یا بر مبنای مشخصات ترکیب/طرح اختلاط انجام شود. روش انتخاب‌شده باید در سفارش و قرارداد روشن باشد."],
["مشخصات عملکردی","حسب مورد، اطلاعاتی مانند اندازه اسمی بزرگ‌ترین سنگدانه، روانی/کارایی، هوای بتن، رده مقاومت، شرایط محیطی، نوع سیمان، حداقل سیمان، مواد مکمل، نسبت آب مؤثر به مواد سیمانی و روش انتقال باید مشخص شوند."],
["رده مقاومت","فصل رده‌های مقاومت C و LC را برای بتن معمولی و سبک مطرح می‌کند. رده انتخابی باید در ارتباط با مشخصات فنی پروژه و سفارش دیده شود."],
["اطلاعات ترکیب","در سفارش مبتنی بر ترکیب، مشخصات اجزای طرح و الزامات مربوط باید صریح باشند تا تولیدکننده بداند چه چیزی باید ساخته و کنترل شود."],
["تحویل و انتقال","اطلاعات محل تحویل، روش انتقال و سایر اطلاعات لازم برای اجرای سفارش بخشی از زنجیره سفارش است؛ ابهام در این قسمت می‌تواند ردیابی QC را دشوار کند."],
["ردیابی","طرح اختلاط، مشخصات مواد، نتایج آزمون‌ها و اطلاعات سفارش باید به شکلی نگهداری شوند که ارتباط سفارش ← تولید ← محموله ← آزمون قابل بازسازی باشد."]
];let i=0,t=null,$=id=>document.getElementById(id);function render(){let b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('q').textContent=b[0];$('sub').textContent='سفارش ← تولید ← تحویل ← آزمون';$('count').textContent=(i+1)+' / '+beats.length;$('bar').style.width=((i+1)/beats.length*100)+'%';$('cards').innerHTML=beats.map((v,k)=>'<g><rect x="'+(140+k*230)+'" y="220" width="200" height="275" rx="22" fill="'+(k===i?'#173c2a':'#dce9df')+'"/><text x="'+(240+k*230)+'" y="285" font-size="19" font-weight="700" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+(k+1)+'</text><text x="'+(240+k*230)+'" y="345" font-size="18" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+v[0].slice(0,13)+'</text></g>').join('')}function stop(){if(t){clearInterval(t);t=null;$('play').textContent='پخش'}}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(t){stop();return}t=setInterval(()=>{if(i===beats.length-1){stop();return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('result').textContent=b.dataset.ok==='1'?'درست — سفارش باید به اطلاعاتی تبدیل شود که تولید و کنترل آن ممکن و قابل ردیابی باشد.':'کافی نیست — ابهام در سفارش مستقیماً روی تولید و کنترل اثر می‌گذارد.'});render();
</script></body></html>
