<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 14 — کنترل تولید و بازرسی واحد تولیدی</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../lib/engine.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 14</div><div class="tag">کنترل تولید و بازرسی</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۱۴ — کنترل تولید و بازرسی</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">سامانه کنترل تولید = مسئولیت + روش اجرایی + سوابق</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="book-controls controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">سامانه کنترل تولید را با مسئولیت‌ها، روش‌ها و سوابق بررسی می‌کنم</button><button data-ok="0">فقط نتیجه نهایی آزمون را ببینم</button><button data-ok="0">صلاحیت کارکنان را جدا از سامانه کنترل کیفیت بدانم</button><p id="result"></p></div></div><section class="panel simulation-panel" aria-labelledby="pc-title"><h2 id="pc-title">تمرین بررسی سامانه کنترل تولید</h2><p>این سناریو آموزشی است. فصل ۱۴ موضوعات اصلی سامانه کنترل تولید را بررسی می‌کند؛ تیک‌ها فقط ثبت موارد کنترل‌شده در تمرین هستند و به معنی صدور گواهی انطباق نیستند.</p><div class="sim-grid"><label><input id="pc-materials" type="checkbox" checked> انتخاب و کنترل مواد</label><label><input id="pc-mix" type="checkbox" checked> طرح مخلوط و نسبت‌های اختلاط</label><label><input id="pc-competence" type="checkbox" checked> صلاحیت نیروی انسانی</label><label><input id="pc-equipment" type="checkbox" checked> تجهیزات و فرایندهای تولید و کنترل</label><label><input id="pc-testing" type="checkbox" checked> بازرسی و آزمون بتن تازه و سخت‌شده</label><label><input id="pc-records" type="checkbox" checked> استفاده از نتایج آزمون و سوابق کنترل</label></div><button id="run-pc">ارزیابی سامانه کنترل تولید</button><div id="pc-output" class="sim-result" aria-live="polite"></div><p class="sim-source"><strong>SOURCE:</strong> فصل ۱۴، بندهای 14-1 و 14-2.</p></section></section></main><script src="./app.js"></script><script src="../lib/simulations.js"></script><script>(function(){const b=document.getElementById('run-pc'),o=document.getElementById('pc-output');if(!b||!o)return;b.onclick=()=>{const r=SimulationEngine.ch14.calculate({materials:document.getElementById('pc-materials').checked,mixDesign:document.getElementById('pc-mix').checked,competence:document.getElementById('pc-competence').checked,equipment:document.getElementById('pc-equipment').checked,testing:document.getElementById('pc-testing').checked,records:document.getElementById('pc-records').checked});o.innerHTML='<strong>'+(r.complete?'موضوعات اصلی کنترل تولید در این سناریو ثبت شده‌اند.':'سناریو ناقص است.')+'</strong>'+(r.missing.length?'<br>موارد بدون شواهد: '+r.missing.join('، '):'<br>همه موضوعات این چک‌لیست دارای شواهد هستند.');o.className='sim-result '+(r.complete?'good':'bad')}})();</script><script src="../lib/engine.js"></script></body></html>
