<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 14 — کنترل تولید و بازرسی واحد تولیدی</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 14</div><div class="tag">کنترل تولید و بازرسی</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۱۴ — کنترل تولید و بازرسی</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">سیستم کنترل تولید = مسئولیت + روش + شواهد</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">سیستم کنترل تولید را با سوابق و مسئولیت‌ها بررسی کنم</button><button data-ok="0">فقط نتیجه آزمایش نهایی را ببینم</button><button data-ok="0">صلاحیت کارکنان را خارج از سیستم QC بدانم</button><p id="result"></p></div></div><section class="panel simulation-panel" aria-labelledby="pc-title"><h2 id="pc-title">شبیه‌ساز اتاق کنترل تولید</h2><p>این سناریو آموزشی است. فصل ۱۴ موضوعات اصلی سامانه کنترل تولید را بررسی می‌کند؛ تیک‌ها به معنی ثبت شواهد در سیستم هستند، نه صدور گواهی انطباق.</p><div class="sim-grid"><label><input id="pc-materials" type="checkbox" checked> انتخاب و کنترل مواد</label><label><input id="pc-mix" type="checkbox" checked> طرح مخلوط و نسبت‌های اختلاط</label><label><input id="pc-competence" type="checkbox" checked> صلاحیت نیروی انسانی</label><label><input id="pc-equipment" type="checkbox" checked> تجهیزات و فرایندهای تولید و کنترل</label><label><input id="pc-testing" type="checkbox" checked> بازرسی و آزمون بتن تازه و سخت‌شده</label><label><input id="pc-records" type="checkbox" checked> استفاده از نتایج آزمون و سوابق کنترل</label></div><button id="run-pc">ارزیابی سامانه</button><div id="pc-output" class="sim-result" aria-live="polite"></div><p class="sim-source"><strong>SOURCE:</strong> فصل ۱۴، بندهای 14-1 و 14-2.</p></section></section></main><script>
const beats=[
["مسئولیت تولیدکننده","کنترل تولید فقط کار آزمایشگاه نیست؛ فصل مسئولیت تولیدکننده را در چارچوب یک سیستم کنترل تولید مطرح می‌کند."],
["سیستم کنترل تولید","سیستم کنترل تولید باید روش‌ها و کنترل‌های لازم برای تولید را دربرگیرد و شواهد اجرای آن‌ها قابل ثبت و بازیابی باشد."],
["مواد و تجهیزات","مواد اولیه و تجهیزات تولید باید کنترل شوند. ارتباط این کنترل با فصل ۴ و فصل ۱۳ باعث می‌شود زنجیره از ورودی تا تولید قطع نشود."],
["آزمون اولیه و طرح اختلاط","آزمون اولیه و طرح اختلاط بخشی از شواهد توانایی تولید بتن مطابق مشخصات موردنظر هستند؛ تغییرات مواد یا شرایط باید در سیستم دیده شوند."],
["صلاحیت کارکنان","صلاحیت و توانایی کارکنان در اجرای فعالیت‌های مرتبط با تولید و کنترل باید در سیستم کنترل تولید دیده شود."],
["سوابق و ردیابی","سوابق آزمون، تولید، مواد، تجهیزات و تصمیم‌ها باید قابل ردیابی باشند. یک سیستم خوب باید بتواند نشان دهد «چه چیزی، چه زمانی، توسط چه کسی و با چه شواهدی» کنترل شده است."]
];let i=0,t=null,$=id=>document.getElementById(id);function render(){let b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('q').textContent=b[0];$('sub').textContent='ورودی‌ها → تولید → آزمون → سوابق → بازرسی';$('count').textContent=(i+1)+' / '+beats.length;$('bar').style.width=((i+1)/beats.length*100)+'%';$('cards').innerHTML=beats.map((v,k)=>'<g><rect x="'+(140+k*230)+'" y="220" width="200" height="275" rx="22" fill="'+(k===i?'#173c2a':'#dce9df')+'"/><text x="'+(240+k*230)+'" y="285" font-size="19" font-weight="700" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+(k+1)+'</text><text x="'+(240+k*230)+'" y="345" font-size="18" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+v[0].slice(0,14)+'</text></g>').join('')}function stop(){if(t){clearInterval(t);t=null;$('play').textContent='پخش'}}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(t){stop();return}t=setInterval(()=>{if(i===beats.length-1){stop();return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('result').textContent=b.dataset.ok==='1'?'درست — فصل ۱۴ یک سیستم است، نه یک برگه آزمایش.':'کافی نیست — ارزیابی کنترل تولید به شواهد و سوابق سیستم نیاز دارد.'});render();
</script><script>(function(){const b=document.getElementById('run-pc'),o=document.getElementById('pc-output');if(!b||!o)return;b.onclick=()=>{const r=SimulationEngine.ch14.calculate({materials:document.getElementById('pc-materials').checked,mixDesign:document.getElementById('pc-mix').checked,competence:document.getElementById('pc-competence').checked,equipment:document.getElementById('pc-equipment').checked,testing:document.getElementById('pc-testing').checked,records:document.getElementById('pc-records').checked});o.innerHTML='<strong>'+(r.complete?'موضوعات اصلی کنترل تولید در این سناریو ثبت شده‌اند.':'سناریو ناقص است.')+'</strong>'+(r.missing.length?'<br>موارد بدون شواهد: '+r.missing.join('، '):'<br>همه موضوعات این چک‌لیست دارای شواهد هستند.');o.className='sim-result '+(r.complete?'good':'bad')}})();</script></body></html>
