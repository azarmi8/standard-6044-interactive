<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 4 — مصالح</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 4</div><div class="tag">مصالح</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۴ — مصالح</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">از ماده اولیه تا شواهد انطباق</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="controls"><nav class="chapter-nav" aria-label="ناوبری فصل"><a class="secondary nav-link" href="../ch03/">← فصل قبلی</a><a class="secondary nav-link" href="../">فهرست</a><a class="secondary nav-link" href="../ch05/">فصل بعدی →</a></nav><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">انطباق ماده + آزمون/مدرک + ردیابی را با هم ببینم</button><button data-ok="0">فقط نام ماده را ثبت کنم</button><button data-ok="0">بدون توجه به استاندارد مربوط، ماده را مصرف کنم</button><p id="result"></p></div></div></section></main><script>
const beats=[
["کلیات","مصالح تشکیل‌دهنده بتن آماده باید با استانداردهای ملی مرتبط منطبق باشند. اگر برای ماده موردنظر استاندارد ملی مشخصی وجود نداشته باشد، استاندارد معتبر خارجی یا منطقه‌ای و مدارک انطباق/آزمون مطرح می‌شود."],
["مواد سیمانی","سیمان هیدرولیکی و مواد مکمل سیمانی باید مطابق استاندارد مربوط کنترل شوند؛ از جمله موادی مانند دوده سیلیسی، پوزولان طبیعی و سرباره دانه‌ای کوره‌آهن‌گدازی، حسب مورد."],
["سنگدانه","سنگدانه‌های معمولی، سبک و سنگین باید بر اساس استانداردهای مربوط به گروه خود کنترل شوند. مشخصات ماده اولیه باید به‌گونه‌ای ثبت شود که به محموله و طرح اختلاط قابل ردیابی باشد."],
["افزودنی‌های شیمیایی","افزودنی‌هایی مانند کاهنده آب، حباب‌زا، دیرگیر یا زودگیر باید با الزامات مربوط سازگار باشند. مقدار مصرف فقط یک عدد ثابت نیست؛ باید در ارتباط با عملکرد موردنیاز و کنترل تولید دیده شود."],
["آب","آب مصرفی بتن باید الزامات استاندارد ملی ۱۴۷۴۸ را برآورده کند. در کنترل QC، منبع آب، وضعیت انطباق و سوابق مرتبط باید قابل پیگیری باشد."],
["تصمیم QC","ورودی صحیح فصل ۴ یک «ماده» نیست؛ یک زنجیره است: ماده مشخص → استاندارد مربوط → شواهد انطباق/آزمون → ثبت → ارتباط با تولید و طرح اختلاط."]
];let i=0,t=null,$=id=>document.getElementById(id);function render(){let b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('q').textContent=b[0];$('sub').textContent='۶۰۴۴:۱۳۹۷  •  مرحله '+(i+1)+' از '+beats.length;$('count').textContent=(i+1)+' / '+beats.length;$('bar').style.width=((i+1)/beats.length*100)+'%';$('cards').innerHTML=beats.map((v,k)=>'<g><rect x="'+(150+k*220)+'" y="210" width="190" height="300" rx="22" fill="'+(k===i?'#173c2a':'#dce9df')+'"/><text x="'+(245+k*220)+'" y="275" font-size="20" font-weight="700" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+(k+1)+'</text><text x="'+(245+k*220)+'" y="335" font-size="19" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+v[0].slice(0,14)+'</text></g>').join('')}function stop(){if(t){clearInterval(t);t=null;$('play').textContent='پخش'}}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(t){stop();return}t=setInterval(()=>{if(i===beats.length-1){stop();return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('result').textContent=b.dataset.ok==='1'?'درست — کنترل مصالح باید قابل ردیابی و مبتنی بر الزامات مربوط باشد.':'کافی نیست — فصل ۴ فقط فهرست مواد نیست؛ انطباق و شواهد آن هم مهم است.'});render();
</script></body></html>
