<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 11 — الزامات بتن سخت‌شده</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 11</div><div class="tag">بتن سخت‌شده</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۱۱ — الزامات بتن سخت‌شده</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">از نمونه‌سازی تا معیار پذیرش</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">نمونه‌سازی، آزمون و معیار پذیرش را یک زنجیره بدانم</button><button data-ok="0">فقط نتیجه دستگاه را ببینم</button><button data-ok="0">بدون توجه به تناوب نمونه‌برداری تصمیم بگیرم</button><p id="result"></p></div></div></section></main><script>
const beats=[
["ساخت نمونه","ساخت نمونه‌های آزمون باید طبق ۱۶۰۸-۲ انجام شود. کیفیت نتیجه مقاومت از کیفیت مرحله نمونه‌گیری و ساخت نمونه جدا نیست."],
["آزمون مقاومت","آزمون مقاومت طبق ۱۶۰۸-۳ در محتوای فصل مطرح است. نتیجه باید به نمونه، محموله و مشخصات مورد ارزیابی قابل اتصال باشد."],
["تناوب نمونه‌برداری","طبق فصل ۱۱، حداقل یک نمونه‌برداری در هر 50 m³ و پس از آن در هر 150 m³ یا هر دو ساعت، هرکدام که نمونه بیشتری ایجاد کند، انجام می‌شود. هر نوبت نمونه‌برداری حداقل دو نمونه استاندارد دارد."],
["نتیجه متوالی و تک‌نمونه","معیار انطباق مقاومت فشاری شامل این دو شرط است: میانگین سه نتیجه نمونه‌برداری متوالی کمتر از مقاومت مشخصه fc نباشد؛ و هیچ نتیجه منفردی کمتر از 0.9fc نباشد. این معیارها باید با نمونه و محل بتن‌ریزی قابل ردیابی باشند."],
["بتن سبک و سنگین","برای بتن سبک و سنگین، موضوع چگالی نیز مطرح است و فصل به ۷۵۱۶ یا ASTM C567/C567M ارجاع می‌دهد."],
["زنجیره پذیرش","نمونه‌برداری → ساخت نمونه → آزمون → ثبت نتیجه → معیار ارزیابی. شکستن هر حلقه می‌تواند تفسیر نتیجه را دشوار کند."]
];let i=0,t=null,$=id=>document.getElementById(id);function render(){let b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('q').textContent=b[0];$('sub').textContent='نمونه → آزمون → معیار → تصمیم';$('count').textContent=(i+1)+' / '+beats.length;$('bar').style.width=((i+1)/beats.length*100)+'%';$('cards').innerHTML=beats.map((v,k)=>'<g><rect x="'+(140+k*230)+'" y="220" width="200" height="275" rx="22" fill="'+(k===i?'#173c2a':'#dce9df')+'"/><text x="'+(240+k*230)+'" y="285" font-size="19" font-weight="700" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+(k+1)+'</text><text x="'+(240+k*230)+'" y="345" font-size="18" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+v[0].slice(0,14)+'</text></g>').join('')}function stop(){if(t){clearInterval(t);t=null;$('play').textContent='پخش'}}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(t){stop();return}t=setInterval(()=>{if(i===beats.length-1){stop();return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('result').textContent=b.dataset.ok==='1'?'درست — نتیجه مقاومت باید در زنجیره نمونه‌برداری و معیار مربوط تفسیر شود.':'کافی نیست — یک عدد آزمایشگاهی بدون زمینه نمونه و معیار، تصمیم کامل ایجاد نمی‌کند.'});render();
</script></body></html>
