<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>۶۰۴۴ — آماده‌سازی آزمونه</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><section class="card"><div class="panel"><h1>شبیه‌ساز آماده‌سازی و ردیابی آزمونه</h1><p>این ابزار آموزشی فقط ثبت و ردیابی را بررسی می‌کند. ساخت و عمل‌آوری طبق ISIRI 1608-2 و آزمون مقاومت طبق ISIRI 1608-3 است.</p><label>شناسه نمونه <input id="a"></label><label>شناسه کامیون <input id="b"></label><label>محل بتن‌ریزی <input id="c"></label><label>محل نمونه‌برداری <input id="d"></label><label>تعداد آزمونه <input id="e" type="number" value="2"></label><button id="go">بررسی</button><p id="out"></p><p><strong>SOURCE:</strong> فصل ۱۱، بند 11-1.</p></div></section></main><script src="../lib/simulations.js"></script><script>(function(){go.onclick=function(){var r=SimulationEngine.specimen.calculate({sampleId:a.value,truckId:b.value,placementLocation:c.value,samplingLocation:d.value,specimenCount:Number(e.value)});out.textContent=r.valid?(r.ready?'آماده: اطلاعات ردیابی کامل است.':'ناقص: '+r.missing.join('، ')):r.error}})()</script></body></html>
