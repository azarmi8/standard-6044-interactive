<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 9 — نمونه‌برداری از بتن تازه</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 9</div><div class="tag">نمونه‌برداری از بتن تازه</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۹ — نمونه‌برداری از بتن تازه</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">نمونه باید نماینده بار و قابل ردیابی باشد</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">زمان، محل، بار/وسیله و ارتباط نمونه را ثبت کنم</button><button data-ok="0">از هر جای بتن و بدون شناسه نمونه بردارم</button><button data-ok="0">نمونه را بدون ارتباط با بار تحویلی نگه دارم</button><p id="result"></p></div></div></section></main><script>
const beats=[
["صلاحیت و تجهیزات","نمونه‌برداری باید با صلاحیت و تجهیزات مناسب انجام شود تا نمونه‌ای که برای آزمون انتخاب می‌شود نماینده بتن موردنظر باشد."],
["نمونه نماینده","نمونه باید نماینده بار تحویلی باشد؛ هدف فقط «داشتن یک نمونه» نیست، بلکه داشتن نمونه‌ای است که بتوان نتیجه آن را به بتن مربوط نسبت داد."],
["شناسه و زمان","زمان نمونه‌برداری، محل، شماره بار و وسیله حمل از اطلاعات کلیدی ردیابی هستند و باید در سوابق مرتبط ثبت شوند."],
["آزمون بتن تازه","آزمون‌های بتن تازه باید به نمونه‌برداری درست متصل باشند. نتیجه آزمایش وقتی ارزش QC دارد که هویت نمونه و شرایط برداشت آن روشن باشد."],
["ارتباط با مقاومت","نمونه‌برداری بتن تازه با فرآیند تهیه نمونه‌های مقاومت ارتباط دارد؛ زنجیره نمونه تا آزمون سخت‌شده نباید گسسته شود."],
["عدم انطباق","اگر نتیجه یا شرایط نمونه‌برداری مسئله‌ای ایجاد کند، مسیر بررسی باید بر اساس بندهای مرتبط، مشخصات پروژه و سوابق انجام شود؛ از یک عدد منفرد تصمیم‌گیری نشود."]
];let i=0,t=null,$=id=>document.getElementById(id);function render(){let b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('q').textContent=b[0];$('sub').textContent='بار تحویلی → نمونه نماینده → آزمون → تصمیم';$('count').textContent=(i+1)+' / '+beats.length;$('bar').style.width=((i+1)/beats.length*100)+'%';$('cards').innerHTML=beats.map((v,k)=>'<g><rect x="'+(140+k*230)+'" y="220" width="200" height="275" rx="22" fill="'+(k===i?'#173c2a':'#dce9df')+'"/><text x="'+(240+k*230)+'" y="285" font-size="19" font-weight="700" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+(k+1)+'</text><text x="'+(240+k*230)+'" y="345" font-size="18" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+v[0].slice(0,14)+'</text></g>').join('')}function stop(){if(t){clearInterval(t);t=null;$('play').textContent='پخش'}}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(t){stop();return}t=setInterval(()=>{if(i===beats.length-1){stop();return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('result').textContent=b.dataset.ok==='1'?'درست — نمونه باید هویت، نمایندگی و مسیر آزمون مشخص داشته باشد.':'کافی نیست — بدون ردیابی، نتیجه آزمایش قابل اتکای کامل برای تصمیم QC نیست.'});render();
</script></body></html>
