<h2 id="g-sim-title">Change Map — نوع تغییر را تشخیص بده</h2>
<p>سناریوی آموزشی: یک مورد از نسخه مرجع پیدا شده است. مشخص کن باید آن را در کدام دسته تغییرات جست‌وجو کنی.</p>
<div class="sim-grid">
<label>نوع تغییر
<select id="g-kind"><option value="deleted">حذف‌شده</option><option value="replaced">جایگزین/جابه‌جاشده</option><option value="added">اضافه‌شده</option></select></label>
</div>
<button id="run-g-sim">نمایش توضیح</button>
<div id="g-output" class="sim-result" aria-live="polite"></div>
<p class="sim-source"><strong>SOURCE:</strong> پیوست ز، بخش‌های ج-۱ تا ج-۳، صفحات ۷۱ و ۷۲.</p>
</section>
