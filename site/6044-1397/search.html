<body><main class="shell"><div class="top"><div class="brand">AZARMI / جست‌وجوی استاندارد</div><div class="tag">جست‌وجوی مطالب استاندارد</div></div>
<section class="card panel"><h1>جست‌وجوی استاندارد ۶۰۴۴:۱۳۹۷</h1><p class="muted">جست‌وجوی محلی و بدون نیاز به سرویس بیرونی؛ نتیجه شما را به بخش مرتبط کتاب هدایت می‌کند.</p>

<script src="lib/search.js"></script><script>
const q=document.getElementById('q'),out=document.getElementById('results');
function render(){const r=BookSearch.search(q.value);out.innerHTML=r.length?r.map(x=>'<article class="panel"><h2><a href="'+x.url+'">فصل/پیوست '+x.unit+' — '+x.title+'</a></h2><p>'+x.text+'</p><small>واژه‌های مرتبط: '+x.tags+'</small></article>').join(''):'<p class="muted">نتیجه‌ای پیدا نشد.</p>';}
q.oninput=render;render();q.focus();
</script><script src="lib/navigation.js"></script></body></html>
