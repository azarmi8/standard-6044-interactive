<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZARMI 6044 — ارزیابی یادگیری</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><div class="top"><div class="brand">AZARMI / ارزیابی یادگیری</div><div class="tag">ارزیابی یادگیری</div></div>
<section class="card panel"><h1>ارزیابی یادگیری استاندارد ۶۰۴۴:۱۳۹۷</h1><p class="muted">تمرین‌ها آموزشی‌اند؛ نتیجه این صفحه گواهی صلاحیت یا تأیید پروژه نیست.</p>
<div id="summary" class="sim-result"></div><div id="question"></div><div id="feedback" class="panel" aria-live="polite"></div>
<div class="controls"><button id="prev" class="secondary">قبلی</button><button id="next">بعدی</button><button id="finish" class="secondary">نمایش نتیجه نهایی</button><button id="reset" class="secondary">شروع دوباره</button></div>
</section></main><script src="lib/assessment.js"></script><script>
let i=0,answers=AssessmentEngine.getState().answers,$=x=>document.getElementById(x);
function renderSummary(){const s=AssessmentEngine.summary();$('summary').innerHTML='<strong>امتیاز: '+s.correct+' / '+s.total+' — '+s.percent+'٪</strong><br>پاسخ‌داده‌شده: '+s.answered+' | مباحث نیازمند مرور: '+(s.weak.length?s.weak.join('، '):'نداریم');}
function render(){const q=AssessmentEngine.questions[i];$('feedback').innerHTML='';let h='<div class="panel"><p><strong>سؤال '+(i+1)+' از '+AssessmentEngine.questions.length+'</strong> — '+q.source+' — '+q.difficulty+'</p><h2>'+q.prompt+'</h2>';
if(q.type==='mcq'||q.type==='scenario'||q.type==='truefalse'){const opts=q.type==='truefalse'?['درست','نادرست']:q.options;h+=opts.map((o,k)=>'<button class="quiz-opt" data-v="'+k+'">'+o+'</button>').join('');}
if(q.type==='numeric')h+='<input id="numeric" type="number" step="any" placeholder="عدد را وارد کنید">';
if(q.type==='sequence'){h+='<p>برای این سؤال، ترتیب را با انتخاب مرحله‌ها بسازید:</p><div id="seq"></div>';}
h+='</div>'; $('question').innerHTML=h;
if(q.type==='sequence')renderSequence(q);
document.querySelectorAll('.quiz-opt').forEach(b=>b.onclick=()=>answer(q,q.type==='truefalse'?b.dataset.v==='0':Number(b.dataset.v)));
if(q.type==='numeric'){$('numeric').onchange=()=>answer(q,Number($('numeric').value));}
}
function renderSequence(q){let pool=Object.entries(q.labels),chosen=[];$('seq').innerHTML=pool.map(([k,v])=>'<button class="quiz-opt" data-k="'+k+'">'+v+'</button>').join('');
document.querySelectorAll('#seq button').forEach(b=>b.onclick=()=>{if(chosen.includes(b.dataset.k))return;chosen.push(b.dataset.k);b.disabled=true;$('feedback').textContent='انتخاب '+chosen.length+': '+q.labels[b.dataset.k];if(chosen.length===pool.length)answer(q,chosen);});}
function answer(q,value){const r=AssessmentEngine.submit(q.id,value);answers=AssessmentEngine.getState().answers;$('feedback').innerHTML='<strong>'+(r.correct?'✓ درست':'✗ نادرست')+'</strong><br>'+r.explanation;renderSummary();}
$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('next').onclick=()=>{i=Math.min(AssessmentEngine.questions.length-1,i+1);render()};$('finish').onclick=()=>{const s=AssessmentEngine.summary();$('feedback').innerHTML='<h2>نتیجه نهایی</h2><p>امتیاز: <strong>'+s.percent+'٪</strong></p><p>نقاط نیازمند مرور: '+(s.weak.length?s.weak.join('، '):'موردی ثبت نشده')+'</p><p>'+ (s.recommendations.length?s.recommendations.join(' — '):'مرور هدفمند لازم نیست.')+'</p>';};$('reset').onclick=()=>{AssessmentEngine.reset();location.reload()};renderSummary();render();
</script><script src="lib/navigation.js"></script></body></html>
