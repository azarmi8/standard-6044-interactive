<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 7 — اختلاط و تحویل</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 7</div><div class="tag">اختلاط و تحویل</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="82" font-size="38" font-weight="700" text-anchor="end">فصل ۷ — اختلاط و تحویل</text><text x="1450" y="125" font-size="21" fill="#68736b" text-anchor="end">از طرح اختلاط تا بتن تحویلی</text><g id="cards"></g><rect x="120" y="610" width="1360" height="150" rx="30" fill="#173c2a"/><text id="q" x="800" y="670" fill="#fff" font-size="28" text-anchor="middle"></text><text id="sub" x="800" y="715" fill="#dce9df" font-size="20" text-anchor="middle"></text></svg></div><div class="controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><button data-ok="1">اختلاط، یکنواختی، تحویل و سوابق را یک زنجیره ببینم</button><button data-ok="0">فقط زمان خروج کامیون را ثبت کنم</button><button data-ok="0">بدون کنترل یکنواختی، بتن را تحویل بدهم</button><p id="result"></p></div></div></section></main><script>
const beats=[
["روش اختلاط","روش اختلاط باید به‌گونه‌ای باشد که بتن یکنواخت تولید شود. فرآیند واقعی تولید باید با روش انتخاب‌شده و تجهیزات مربوط سازگار باشد."],
["تجهیزات اختلاط","ظرفیت و شرایط کاری مخلوط‌کن باید با تولید موردنظر سازگار باشد. وضعیت تجهیزات بخشی از کنترل تولید است، نه موضوعی جدا از کیفیت."],
["افزودن آب و مواد","هر تغییر یا افزودن در فرآیند باید در چارچوب الزامات و سوابق مربوط دیده شود؛ تصمیم لحظه‌ای بدون ثبت، ردیابی محموله را ضعیف می‌کند."],
["یکنواختی","هدف عملی اختلاط، رسیدن به بتن یکنواخت است. کنترل یکنواختی باید با نمونه‌برداری و آزمون‌های مرتبط پشتیبانی شود."],
["تحویل","بتن باید با اطلاعات سفارش و مشخصات محموله به محل تحویل برسد و شرایط تحویل به شکلی ثبت شود که ارتباط بار با آزمون‌ها حفظ شود."],
["تصمیم QC","زنجیره این فصل را به صورت تولید → کنترل یکنواختی → تحویل → نمونه‌برداری → سوابق ببین؛ هر حلقه باید قابل بازسازی باشد."]
];let i=0,t=null,$=id=>document.getElementById(id);function render(){let b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('q').textContent=b[0];$('sub').textContent='اختلاط → یکنواختی → تحویل → ردیابی';$('count').textContent=(i+1)+' / '+beats.length;$('bar').style.width=((i+1)/beats.length*100)+'%';$('cards').innerHTML=beats.map((v,k)=>'<g><rect x="'+(140+k*230)+'" y="220" width="200" height="275" rx="22" fill="'+(k===i?'#173c2a':'#dce9df')+'"/><text x="'+(240+k*230)+'" y="285" font-size="19" font-weight="700" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+(k+1)+'</text><text x="'+(240+k*230)+'" y="345" font-size="18" text-anchor="middle" fill="'+(k===i?'#fff':'#173c2a')+'">'+v[0].slice(0,14)+'</text></g>').join('')}function stop(){if(t){clearInterval(t);t=null;$('play').textContent='پخش'}}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(t){stop();return}t=setInterval(()=>{if(i===beats.length-1){stop();return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('result').textContent=b.dataset.ok==='1'?'درست — فصل ۷ باید تولید و تحویل را در یک زنجیره کنترل ببیند.':'کافی نیست — صرفاً ثبت زمان خروج، یکنواختی و قابلیت ردیابی را اثبات نمی‌کند.'});render();
</script></body></html>
