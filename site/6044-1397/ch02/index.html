<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فصل 2 — مراجع الزامی</title><link rel="stylesheet" href="../style.css"></head><body><main class="shell"><div class="top"><div class="brand">۶۰۴۴ / فصل 2</div><div class="tag">مراجع الزامی</div></div><section class="card"><div class="stage"><svg viewBox="0 0 1600 900" width="100%" height="100%"><rect width="1600" height="900" fill="#f5f1e6"/><text x="1450" y="90" font-size="38" font-weight="700" text-anchor="end">فصل 2 — مراجع الزامی</text><text x="1450" y="135" font-size="22" fill="#68736b" text-anchor="end">مبانی / استاندارد ملی ایران ۶۰۴۴:۱۳۹۷</text><g id="cards"></g><rect x="130" y="570" width="1340" height="180" rx="30" fill="#173c2a"/><text id="svgt" x="800" y="635" fill="#fff" font-size="30" text-anchor="middle"></text><text id="svgsub" x="800" y="690" fill="#dce9df" font-size="21" text-anchor="middle"></text></svg></div><div class="controls"><button id="prev" class="secondary">قبلی</button><button id="play">پخش</button><button id="next">بعدی</button><div class="progress"><i id="bar"></i></div><span id="count"></span></div><div class="panel"><h2 id="title"></h2><p id="body"></p><div class="quiz"><h3>بررسی سریع</h3><p>بهترین روش استفاده از این فصل در کنترل کیفیت چیست؟</p><button data-q="good">ارتباط آن با سفارش، تولید، آزمون و سوابق را بررسی کنم</button><button data-q="bad">فقط یک عدد آزمایشگاهی را نگاه کنم</button><button data-q="bad">بدون ثبت و ردیابی تصمیم بگیرم</button><p id="quizResult"></p></div></div></section></main><script>const beats=[["منطق ارجاع","مراجع الزامی بخشی از متن الزام‌آور استاندارد هستند. اگر در متن به مرجعی بدون تاریخ انتشار ارجاع شده باشد، آخرین ویرایش و اصلاحیه‌های بعدی آن ملاک است؛ ارجاع تاریخ‌دار، همان نسخه مشخص‌شده را دنبال می‌کند."],["مراجع ملی","فهرست استانداردهای ملی مورد استفاده شامل روش‌های آزمون و الزامات بتن، مصالح، افزودنی‌ها، آب، سنگدانه، کنترل کیفیت و تجهیزات است."],["مراجع ASTM","استاندارد به مجموعه‌ای از مراجع ASTM از جمله C125، C138/C138M، C173/C173M، C231/C231M، C330/C330M، C1064/C1064M، C1077، C1116، C1240، C1611/C1611M و C1797 و نیز ACI 214R ارجاع می‌دهد."],["اصل کنترل نسخه","در یک سیستم حرفه‌ای QC، شماره استاندارد و نسخه مرجع باید در سوابق قابل ردیابی باشد؛ این کتاب نیز مراجع را به‌عنوان لایه مرجع فصل‌ها نمایش می‌دهد."]];let i=0,timer=null;const $=id=>document.getElementById(id);function render(){const b=beats[i];$('title').textContent=b[0];$('body').textContent=b[1];$('svgt').textContent=b[0];$('svgsub').textContent='این مرحله را به مرحله بعدی زنجیره کنترل کیفیت وصل کن.';$('count').textContent=`${i+1} / ${beats.length}`;$('bar').style.width=`${(i+1)/beats.length*100}%`;}$('next').onclick=()=>{i=Math.min(beats.length-1,i+1);render()};$('prev').onclick=()=>{i=Math.max(0,i-1);render()};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='پخش';return}timer=setInterval(()=>{if(i===beats.length-1){clearInterval(timer);timer=null;$('play').textContent='پخش';return}i++;render()},5000);$('play').textContent='توقف'};document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{$('quizResult').textContent=b.dataset.q==='good'?'درست — استاندارد باید در یک زنجیره قابل ردیابی استفاده شود.':'این پاسخ دامنه کنترل را بیش از حد محدود می‌کند.';$('quizResult').className=b.dataset.q});render();</script></body></html>
