<h2 id="d-sim-title">سازنده برنامه کنترل تولید</h2>
<p>سناریوی آموزشی: برای یک برنامه کنترل تولید، چهار لایه شواهد را کامل کن. این چک‌لیست جایگزین متن رسمی پیوست د نیست.</p>
<div class="sim-grid">
<label><input id="d-materials" type="checkbox"> کنترل مواد و مصالح</label>
<label><input id="d-equipment" type="checkbox"> کنترل وسایل و تجهیزات</label>
<label><input id="d-production" type="checkbox"> کنترل روش تولید و خواص بتن</label>
<label><input id="d-records" type="checkbox"> کنترل سوابق و مستندات</label>
</div>
<button id="run-d-sim">بررسی برنامه</button>
<div id="d-output" class="sim-result" aria-live="polite"></div>
<p class="sim-source"><strong>SOURCE:</strong> پیوست د، جداول د-۲ تا د-۴.</p>
</section>
<script src="../lib/appendix-d-g.js"></script>
<script>
(function(){const b=document.getElementById('run-d-sim'),o=document.getElementById('d-output');if(!b||!o)return;b.addEventListener('click',function(){const r=AppendixDG.productionControl.check({materials:document.getElementById('d-materials').checked,equipment:document.getElementById('d-equipment').checked,production:document.getElementById('d-production').checked,records:document.getElementById('d-records').checked});o.innerHTML='<strong>'+(r.complete?'برنامه چهار لایه اصلی کنترل تولید کامل است.':'برنامه ناقص است.')+'</strong>'+(r.missing.length?'<br>موارد ناقص: '+r.missing.join('، '):'<br>همه لایه‌های اصلی دارای شواهد هستند.');o.className='sim-result '+(r.complete?'good':'bad');});})();
</script></section></main><script src="./app.js"></script><script src="../lib/engine.js"></script></body></html>
