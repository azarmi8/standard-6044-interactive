name: Agent HQ Forge E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  forge-e2e:
    if: startsWith(github.event.pull_request.title, '[agent-hq-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Clone private Agent HQ
        env:
          AGENT_HQ_COPILOT_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AGENT_HQ_COPILOT_TOKEN:-}" || {
            echo "Missing AGENT_HQ_COPILOT_TOKEN in standard-6044-interactive."
            exit 2
          }
          export GH_TOKEN="$AGENT_HQ_COPILOT_TOKEN"
          gh repo clone azarmi8/agent-hq "${RUNNER_TEMP}/agent-hq" -- --depth 1

      - name: Run Forge read-only probe
        id: agent
        working-directory: ${{ runner.temp }}/agent-hq
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
          GH_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
        run: |
          set +e
          issue_json="$(gh issue view 125 --repo azarmi8/agent-hq --json number,title,body,comments)"
          prompt="You are Forge, a bounded engineering agent for Agent HQ. Perform a read-only E2E probe. Inspect the repository and issue 125 using real tools. Do not modify files, commits, branches, PRs, workflows, secrets, permissions, billing, governance, or production. Report exact observed facts. Explicitly state whether your Copilot reasoning completed, which real tools you invoked, and whether a provider response was received. Never fabricate telemetry."
          copilot -p "$prompt
MISSION ISSUE JSON:
$issue_json" --allow-tool='shell(gh:*)' --allow-tool='shell(git:*)' --deny-tool='shell(git push)' --deny-tool='shell(rm)' --no-ask-user -s > "${RUNNER_TEMP}/copilot-output.txt" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/copilot-output.txt"
          exit 0

      - name: Publish evidence
        if: always()
        run: |
          echo "Forge exit code: ${{ steps.agent.outputs.exit_code || 'not-started' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${RUNNER_TEMP}/copilot-output.txt" ]; then
            cat "${RUNNER_TEMP}/copilot-output.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
