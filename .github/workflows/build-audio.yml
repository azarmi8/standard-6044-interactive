name: Build Persian narration audio

on:
  push:
    branches:
      - feat/audio-jarvis-engineering-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Generate Persian narration
        run: node tools/tts/generate-audio.mjs
      - name: Commit narration assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/6044-1397/audio/fa tools/tts/audio-manifest.json
          if git diff --cached --quiet; then
            echo "No audio changes."
            exit 0
          fi
          git commit -m "build: add Persian narration audio [skip ci]"
          git push origin HEAD:feat/audio-jarvis-engineering-core
