name: Agent HQ Runner Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  runner-smoke:
    if: >-
      startsWith(github.event.pull_request.title, '[runner-probe]') ||
      startsWith(github.event.pull_request.title, '[agent-hq-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "gh=$(gh --version | head -n 1)"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  forge-e2e:
    if: startsWith(github.event.pull_request.title, '[agent-hq-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify private Agent HQ read access
        env:
          AGENT_HQ_REPO_TOKEN: ${{ secrets.AGENT_HQ_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AGENT_HQ_REPO_TOKEN:-}" || { echo "Missing AGENT_HQ_REPO_TOKEN in standard-6044-interactive."; exit 2; }
          GH_TOKEN="$AGENT_HQ_REPO_TOKEN" gh repo view azarmi8/agent-hq --json nameWithOwner --jq .nameWithOwner
          echo "Private Agent HQ read access: OK"

      - name: Clone private Agent HQ
        env:
          AGENT_HQ_REPO_TOKEN: ${{ secrets.AGENT_HQ_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AGENT_HQ_REPO_TOKEN:-}" || {
            echo "Missing AGENT_HQ_REPO_TOKEN in standard-6044-interactive."
            exit 2
          }
          export GH_TOKEN="${AGENT_HQ_REPO_TOKEN}"
          gh repo clone azarmi8/agent-hq "${RUNNER_TEMP}/agent-hq" -- --depth 1

      - name: Run real Forge read-only probe
        id: agent
        working-directory: ${{ runner.temp }}/agent-hq
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
          GH_TOKEN: ${{ secrets.AGENT_HQ_REPO_TOKEN }}
        run: |
          set +e
          issue_json="$(gh issue view 125 --repo azarmi8/agent-hq --json number,title,body,comments)"
          prompt="You are Forge, a bounded engineering agent for Agent HQ. Perform a read-only E2E probe of issue 125. Inspect the repository and issue using real tools. Do not modify files, commits, branches, PRs, workflows, secrets, permissions, billing, governance, ownership, or production. Report exact observed facts. Explicitly state whether real Copilot reasoning completed, which real tools you invoked, and whether a provider response was received. Never fabricate telemetry."
          full_prompt="$(printf '%s\n\nMISSION ISSUE JSON:\n%s' "$prompt" "$issue_json")"
          copilot -p "$full_prompt" --allow-tool="shell(gh:*)" --allow-tool="shell(git:*)" --deny-tool="shell(git push)" --deny-tool="shell(rm)" --no-ask-user -s > "${RUNNER_TEMP}/copilot-output.txt" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/copilot-output.txt"
          exit 0

      - name: Write Forge evidence
        if: always()
        env:
          AGENT_EXIT: ${{ steps.agent.outputs.exit_code || 'not-started' }}
        run: |
          echo "Forge exit code: $AGENT_EXIT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${RUNNER_TEMP}/copilot-output.txt" ]; then
            cat "${RUNNER_TEMP}/copilot-output.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
