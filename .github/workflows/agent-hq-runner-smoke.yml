name: Agent HQ Runner Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - agent-hq-forge-e2e-20261008

permissions:
  contents: read
  issues: write

jobs:
  runner-smoke:
    if: >-
      github.event_name == 'push' ||
      startsWith(github.event.pull_request.title, '[runner-probe]') ||
      startsWith(github.event.pull_request.title, '[agent-hq-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "gh=$(gh --version | head -n 1)"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  forge-e2e:
    if: >-
      github.event_name == 'push' ||
      startsWith(github.event.pull_request.title, '[agent-hq-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify private Agent HQ read access
        env:
          AGENT_HQ_REPO_TOKEN: ${{ secrets.AGENT_HQ_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AGENT_HQ_REPO_TOKEN:-}" || { echo "Missing AGENT_HQ_REPO_TOKEN in standard-6044-interactive."; exit 2; }
          GH_TOKEN="$AGENT_HQ_REPO_TOKEN" gh repo view azarmi8/agent-hq --json nameWithOwner --jq .nameWithOwner
          echo "Private Agent HQ read access: OK"

      - name: Clone private Agent HQ
        env:
          AGENT_HQ_REPO_TOKEN: ${{ secrets.AGENT_HQ_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AGENT_HQ_REPO_TOKEN:-}" || {
            echo "Missing AGENT_HQ_REPO_TOKEN in standard-6044-interactive."
            exit 2
          }
          export GH_TOKEN="${AGENT_HQ_REPO_TOKEN}"
          gh repo clone azarmi8/agent-hq "${RUNNER_TEMP}/agent-hq" -- --depth 1

      - name: Verify issue read access via REST
        env:
          AGENT_HQ_REPO_TOKEN: ${{ secrets.AGENT_HQ_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AGENT_HQ_REPO_TOKEN:-}" || exit 2
          GH_TOKEN="${AGENT_HQ_REPO_TOKEN}" gh api -H "Accept: application/vnd.github+json" "/repos/azarmi8/agent-hq/issues/125" > "${RUNNER_TEMP}/issue-125.json"
          test -s "${RUNNER_TEMP}/issue-125.json"
          echo "Private Agent HQ issue #125 REST read access: OK"

      - name: Dispatch real Agent HQ supervised mission
        id: mission_dispatch
        env:
          AGENT_HQ_REPO_TOKEN: ${{ secrets.AGENT_HQ_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AGENT_HQ_REPO_TOKEN:-}" || { echo "Missing AGENT_HQ_REPO_TOKEN"; exit 2; }
          export GH_TOKEN="${AGENT_HQ_REPO_TOKEN}"
          gh workflow run cloud-agent-mission.yml --repo azarmi8/agent-hq --ref main \
            -f agent_id=forge-001 \
            -f mission_id=bridge-e2e-${{ github.run_id }} \
            -f task_title="Bridge E2E supervised mission" \
            -f task_instructions="Inspect repository and report current state. Make no code changes. This is a bounded supervised validation run." \
            -f agent_role=coding \
            -f required_capabilities=repository-inspection,validation \
            -f career_mode=supervised-validation \
            -f validation_mode=git-diff-check
          echo "dispatch_exit_code=0" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run real Forge bounded workspace probe
        id: agent
        working-directory: ${{ runner.temp }}/agent-hq
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
          GH_TOKEN: ${{ secrets.AGENT_HQ_REPO_TOKEN }}
        run: |
          set +e
          issue_json="$(cat "${RUNNER_TEMP}/issue-125.json")"
          proof_phrase="FORGE_E2E_TOOL_PROOF_20261008"
          prompt="You are Forge, a bounded engineering agent for Agent HQ. Execute a real, read/write-but-local E2E probe against issue 125. Inspect the repository and issue using real tools. Create a file named FORGE-E2E-PROOF.md in the repository workspace containing exactly the proof phrase '${proof_phrase}', then use git status/diff to verify the file exists and the diff is cleanly formed. Do not commit, push, create branches or PRs, modify workflows, secrets, permissions, billing, governance, ownership, or production. Do not attempt to inspect Actions workflow runs. In your final response report exact observed facts, the tools you actually invoked, and whether the provider responded. Never fabricate telemetry."
          full_prompt="$(printf '%s\n\nMISSION ISSUE JSON:\n%s' "$prompt" "$issue_json")"
          copilot -p "$full_prompt" --allow-tool="shell(gh:*)" --allow-tool="shell(git:*)" --allow-tool="write" --deny-tool="shell(git push)" --deny-tool="shell(rm)" --no-ask-user -s > "${RUNNER_TEMP}/copilot-output.txt" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/copilot-output.txt"
          exit 0

      - name: Verify Forge tool-produced artifact
        if: always()
        working-directory: ${{ runner.temp }}/agent-hq
        run: |
          set -euo pipefail
          test -f FORGE-E2E-PROOF.md
          grep -Fxq "FORGE_E2E_TOOL_PROOF_20261008" FORGE-E2E-PROOF.md
          git diff --check
          echo "Forge tool-produced workspace artifact: OK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write Forge evidence
        if: always()
        env:
          AGENT_EXIT: ${{ steps.agent.outputs.exit_code || 'not-started' }}
        run: |
          echo "Forge exit code: $AGENT_EXIT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${RUNNER_TEMP}/copilot-output.txt" ]; then
            cat "${RUNNER_TEMP}/copilot-output.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
