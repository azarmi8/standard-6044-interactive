name: Agent HQ Zero-Cost Cloud Execution Bridge

on:
  push:
    paths:
      - .github/workflows/agent-hq-cloud-bridge.yml
  workflow_dispatch:
    inputs:
      issue_number:
        description: Agent HQ issue number
        required: true
        default: '125'

permissions:
  contents: read

concurrency:
  group: agent-hq-cloud-bridge
  cancel-in-progress: false

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify free public runner
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "gh=$(gh --version | head -n 1)"

  copilot-mission:
    needs: runner-smoke
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENT_HQ_REPO: azarmi8/agent-hq
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number || '125' }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify bridge secret
        env:
          AGENT_HQ_COPILOT_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AGENT_HQ_COPILOT_TOKEN:-}" || {
            echo "AGENT_HQ_COPILOT_TOKEN is missing in this public bridge repository."
            echo "Add the same fine-grained PAT used for Agent HQ/Copilot as this repository secret."
            exit 2
          }

      - name: Clone private Agent HQ
        env:
          AGENT_HQ_COPILOT_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$AGENT_HQ_COPILOT_TOKEN"
          gh repo clone "$AGENT_HQ_REPO" "${RUNNER_TEMP}/agent-hq" -- --depth 1

      - name: Run real Copilot agent probe
        id: agent
        working-directory: ${{ runner.temp }}/agent-hq
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
          GH_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
        run: |
          set +e
          issue_json="$(gh issue view "$ISSUE_NUMBER" --repo "$AGENT_HQ_REPO" --json number,title,body,comments)"
          cat > "${RUNNER_TEMP}/agent-prompt.txt" <<'PROMPT'
You are Forge, a bounded engineering agent for Agent HQ.

Mission: inspect the specified Agent HQ E2E probe issue and perform a read-only validation.
Repository: azarmi8/agent-hq

Hard constraints:
- Do not modify any file.
- Do not create commits, branches, pull requests, releases, permissions, secrets, billing changes, or governance changes.
- Use real repository and git tools to inspect the repository and the issue.
- Report only observed facts.
- Explicitly state whether your reasoning session actually started.
- Explicitly state which real tools you used.
- Explicitly state whether you found evidence of a provider response.
- Never invent telemetry or execution.
PROMPT
          printf '\nMISSION ISSUE JSON:\n%s\n' "$issue_json" >> "${RUNNER_TEMP}/agent-prompt.txt"
          copilot -p "$(cat "${RUNNER_TEMP}/agent-prompt.txt")" \
            --allow-tool='shell(gh:*)' \
            --allow-tool='shell(git:*)' \
            --deny-tool='shell(git push)' \
            --deny-tool='shell(rm)' \
            --no-ask-user \
            -s > "${RUNNER_TEMP}/copilot-output.txt" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/copilot-output.txt"
          exit 0

      - name: Report probe evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AGENT_HQ_COPILOT_TOKEN }}
          AGENT_EXIT: ${{ steps.agent.outputs.exit_code || 'not-started' }}
        run: |
          set -euo pipefail
          echo "Copilot exit: $AGENT_EXIT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${RUNNER_TEMP}/copilot-output.txt" ]; then
            cat "${RUNNER_TEMP}/copilot-output.txt" >> "$GITHUB_STEP_SUMMARY"
          fi